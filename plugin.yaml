name: linear-agent
label: Linear Agent
kind: standalone
version: 1.3.1
author: realpetru
homepage: https://github.com/realpetru/hermes-linear-agent
description: >
  Turns Hermes into a first-class Linear agent. Assign an issue to the agent or
  @mention it, and Hermes answers in the thread as its own app identity instead of
  posting as a human. Ships both halves: a signature-verified webhook bridge that
  speaks Linear's AgentSessionEvent API, and the tools to inspect that bridge and
  generate the OAuth install URL. Works with any Hermes model and any public
  hostname; everything host-specific is configuration, never code.
requires_hermes: ">=0.22.0"
provides_tools:
  - linear_agent_status
  - linear_agent_authorize_url
capabilities:
  tools:
    - linear_agent_status
    - linear_agent_authorize_url
  hooks: []
  middleware: []
  env:
    - LINEAR_CLIENT_ID
    - LINEAR_CLIENT_SECRET
    - LINEAR_WEBHOOK_SECRET
    - LINEAR_AGENT_PROFILE
    - LINEAR_AGENT_ROUTING
    - LINEAR_AGENT_PUBLIC_URL
    - LINEAR_REDIRECT_URI
    - LINEAR_API_KEY
    - HERMES_GATEWAY_TOKEN
  network: true
  notes: >
    Starts an HTTP listener only when the operator runs `hermes linear-agent serve`.
    Posts to the Linear GraphQL API and to the local Hermes gateway; makes no other
    outbound calls. Manages its own Linear OAuth tokens (no Hermes-managed oauth:
    block), stored in a 0600 file whose path is LINEAR_TOKEN_PATH.
provides_hooks: []
requires_env:
  - name: LINEAR_CLIENT_ID
    description: "Linear OAuth app client ID (Linear -> Settings -> API -> Applications)"
    prompt: "Linear OAuth client ID"
    url: "https://linear.app/settings/api/applications/new"
    password: false
  - name: LINEAR_CLIENT_SECRET
    description: "Linear OAuth app client secret (shown once when the app is created)"
    prompt: "Linear OAuth client secret"
    secret: true
    password: true
  - name: LINEAR_WEBHOOK_SECRET
    description: "Signing secret Linear generates for the app's webhook URL"
    prompt: "Linear webhook signing secret"
    secret: true
    password: true
optional_env:
  - name: LINEAR_AGENT_BRIDGE_URL
    description: "Where the bridge service listens (default http://127.0.0.1:8650)"
    prompt: "Bridge URL"
    password: false
  - name: LINEAR_AGENT_PUBLIC_URL
    description: "Public base URL of the bridge; Linear posts to <this>/webhook (you paste that URL into the app yourself), and the OAuth callback defaults to <this>/oauth/callback"
    prompt: "Public HTTPS URL of the bridge"
    password: false
  - name: LINEAR_AGENT_PROFILE
    description: "Which Hermes agent answers Linear (a profile name; empty = the gateway's default agent)"
    prompt: "Agent profile that answers Linear (empty for default)"
    password: false
  - name: LINEAR_AGENT_ROUTING
    description: 'Optional JSON map of label -> profile, e.g. {"cody":"cody"}; a label route beats LINEAR_AGENT_PROFILE'
    prompt: 'Label routing JSON (optional)'
    password: false
  - name: LINEAR_API_KEY
    description: >
      Optional personal Linear API key. DEVELOPMENT FALLBACK ONLY: activities posted
      with it appear under that person's identity, which is the exact problem this
      plugin exists to fix. Leave empty for a correct install.
    prompt: "Personal Linear API key (leave empty — identity fallback only)"
    password: true
  - name: HERMES_GATEWAY_TOKEN
    description: "Hermes API server key the bridge uses to start runs (Bearer token)"
    prompt: "Hermes API server key"
    password: true
config_schema:
  agent_profile:
    type: str
    default: ""
    description: >-
      Which Hermes agent answers Linear. Write a profile name, e.g. cody — or appy,
      studio, whichever agent should speak. Leave empty and the gateway's default agent
      answers. On the Hermes dashboard, the Linear agent tab lists the profiles that
      actually exist on this host; typing a name that does not exist is rejected.
    required: false
  routing:
    type: dict
    default: {}
    description: >-
      Optional: send issues with a specific label to a specific profile. Example:
      {"cody": "cody", "urgent-bug": "cody"} — the quoted text on the left is the Linear
      label, the one on the right is the Hermes profile. Beats agent_profile for
      matching issues; a label naming no profile falls through to agent_profile, and a
      target naming no existing profile is ignored. The Linear agent dashboard tab edits
      this as rows, so you never have to type JSON by hand.
    required: false
  bridge_url:
    type: str
    default: "http://127.0.0.1:8650"
    description: >-
      Base URL the status tool probes for the bridge. If the plugin runs on the same
      machine as the bridge use http://127.0.0.1:8650; if the bridge runs on another
      host on your network, use its LAN address, e.g. http://192.168.1.50:8650 (and
      remember that 127.0.0.1 inside a container means the container itself).
    required: false
  public_url:
    type: str
    default: ""
    description: >-
      Public base URL of the bridge, e.g. https://your-host.example with no trailing slash.
      Linear posts webhooks to <this>/webhook — paste that exact URL into the app's Webhook
      URL field yourself; nothing is registered automatically. The OAuth callback defaults
      to <this>/oauth/callback, and LINEAR_REDIRECT_URI overrides it when the browser
      finishing the install cannot reach the public host. LINEAR_AGENT_PUBLIC_URL is the
      environment variable form of this setting.
    required: false
  timezone_offset_minutes:
    type: int
    default: 0
    description: "Reserved for future reporting; stored for convenience only"
    required: false
