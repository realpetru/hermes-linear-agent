name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # ubuntu-latest is 26.04, which no longer publishes a Python 3.9 build.
    # 22.04 still does, and the plugin claims 3.9+ support, so stay there.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

  validate:
    # the same check catalog CI runs against a pinned commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install Hermes
        # PyPI lags (0.15.x on older interpreters) and predates `plugins validate`;
        # the plugin needs >=0.22, so install the source of truth.
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/NousResearch/hermes-agent.git@main"
      - name: assert the validator exists
        # fail loudly here instead of with a cryptic argparse exit 2 below
        run: hermes plugins validate --help
      - name: validate plugin
        run: hermes plugins validate . --install-deps
      - name: plugin doctor
        run: hermes plugins doctor . || true
