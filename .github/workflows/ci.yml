name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # ubuntu-latest is 26.04, which no longer publishes a Python 3.9 build.
    # 22.04 still does, and the plugin claims 3.9+ support, so stay there.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

  validate:
    # `hermes plugins validate` is the catalog gate, but it needs a Hermes install:
    # PyPI's package predates the subcommand, and the source tree pulls a large
    # dependency set that intermittently conflicts. So this job runs a local
    # equivalent (scripts/selfcheck.py) as the always-on gate, then runs the
    # official validator when a Hermes install happens to be available.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install selfcheck dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: selfcheck — manifest, entrypoint, registration, declared capabilities
        run: python scripts/selfcheck.py

      - name: install Hermes from source (best effort)
        id: hermes_install
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/NousResearch/hermes-agent.git@main"

      - name: official validator (when a Hermes install is available)
        run: |
          if [ "${{ steps.hermes_install.outcome }}" != "success" ] || ! hermes plugins validate --help >/dev/null 2>&1; then
            echo "::warning::Hermes could not be installed in this runner; the catalog CI runs 'hermes plugins validate' against the pinned commit. The selfcheck above is the in-repo gate."
            exit 0
          fi
          hermes plugins validate . --install-deps

      - name: plugin doctor (informational)
        continue-on-error: true
        run: hermes plugins doctor .
