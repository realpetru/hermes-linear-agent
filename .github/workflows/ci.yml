name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

  validate:
    # the same check catalog CI runs against a pinned commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install Hermes
        run: |
          python -m pip install --upgrade pip
          pip install "hermes-agent" || pip install "git+https://github.com/NousResearch/hermes-agent.git"
      - name: validate plugin
        run: hermes plugins validate . --install-deps
      - name: plugin doctor
        run: hermes plugins doctor . || true
